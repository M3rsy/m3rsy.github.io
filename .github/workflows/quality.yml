name: Calidad del sitio

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HTML y enlaces
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar HTML
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_HTML: true

      - name: Comprobar enlaces
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --root-dir .
            --no-progress
            './**/*.html'
            './**/*.md'
          fail: true

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Auditar sitio estático
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
